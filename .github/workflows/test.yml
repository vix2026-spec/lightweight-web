name: 測試網頁

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4.2.2

      - name: 設定 Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: light_web/package.json

      - name: 安裝依賴套件
        working-directory: light_web
        run: npm install

      - name: 執行測試
        working-directory: light_web
        run: npm test
